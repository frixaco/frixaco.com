<!doctype html>
<html lang="en" data-route="<!--PAGE_ROUTE-->">
  <head>
    <meta charset="utf-8" />
    <meta name="description" content="<!--META_DESCRIPTION-->" />
    <meta name="color-scheme" content="light" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='14' y='14' width='36' height='36' rx='2' fill='%233273dc'/%3E%3C/svg%3E"
    />
    <title><!--PAGE_TITLE--></title>
    <style>
      body {
        background: whitesmoke;
        color: #000;
        display: flex;
        flex-direction: column;
        font-family: "JetBrains Mono";
        font-size: 95%;
        line-height: 1.5;
        margin: auto;
        max-width: 720px;
        min-height: calc(100vh - 40px);
        overflow-wrap: break-word;
        padding: 20px;
        text-align: left;
        text-transform: lowercase;
      }

      a {
        color: #3273dc;
      }

      :focus-visible {
        outline: 2px solid #3273dc;
        outline-offset: 3px;
      }

      header {
        margin-bottom: 25px;
      }

      header > a {
        color: #000;
        text-decoration: none;
      }

      nav a {
        color: #444;
        margin-right: 10px;
      }

      nav a:hover,
      nav a:focus-visible {
        background: #444;
        color: #fff;
      }

      main img {
        max-width: 100%;
      }

      main {
        flex: 1;
      }

      main section {
        scroll-margin-top: 2rem;
      }

      main section + section {
        margin-top: 2.5rem;
      }

      #about img {
        height: 150px;
        object-fit: cover;
        object-position: center;
        width: 150px;
      }

      :is(html[data-route="blog"] main, #blog) > ul {
        list-style-type: none;
        padding: 0;
      }

      :is(html[data-route="blog"] main, #blog) > ul > li {
        display: grid;
        grid-template-columns: 130px minmax(0, 1fr);
        margin-bottom: 1.25rem;
      }

      :is(html[data-route="blog"] main, #blog) > ul > li > p {
        margin: 0.25rem 0;
      }

      :is(html[data-route="blog"] main, #blog) > ul > li > p:first-child {
        display: contents;
      }

      :is(html[data-route="blog"] main, #blog) > ul > li > p:first-child em {
        grid-column: 1;
      }

      :is(html[data-route="blog"] main, #blog) > ul > li > p:first-child a {
        grid-column: 2;
      }

      :is(html[data-route="blog"] main, #blog) > ul > li > p:not(:first-child) {
        grid-column: 2;
      }

      :is(html[data-route="blog"] main, #blog) > ul > li > p:nth-child(2) {
        color: #444;
        font-size: 0.9em;
      }

      :is(html[data-route="blog"] main, #blog) > ul > li > p:nth-child(2) strong {
        font-weight: 400;
      }

      :is(#projects, #work) > ul > li {
        margin-bottom: 1.5rem;
      }

      :is(#projects, #work) > ul > li > p {
        margin: 0.25rem 0;
      }

      main code {
        background: #565656;
        color: #fff;
        font-family: inherit;
        font-size: 98%;
        padding: 2px 5px;
        text-transform: none;
      }

      main pre code {
        display: block;
        line-height: 1.55;
        overflow-wrap: anywhere;
        padding: 20px;
        white-space: pre-wrap;
      }

      main blockquote {
        border-left: 1px solid #999;
        color: #444;
        font-size: 98%;
        font-style: italic;
        margin-bottom: 1.5rem;
        padding-left: 20px;
      }

      main hr {
        margin-bottom: 3rem;
        margin-top: 2rem;
      }

      footer {
        display: flex;
        font-size: 0.85em;
        justify-content: space-between;
        padding-top: 3rem;
      }

      @media (max-width: 768px) {
        body {
          font-size: 18px;
        }

        pre {
          font-size: 0.8em;
          padding: 0;
        }

        h1,
        h2,
        h3,
        h4 {
          font-size: 1.5em;
        }

        code {
          font-size: 90%;
        }

        nav a {
          font-size: 0.9em;
        }

        blockquote {
          font-size: 90%;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/" aria-label="Rustam Ashurmatov, home">
        <h2>welcome to my corner of the internet</h2>
      </a>
      <nav aria-label="Primary">
        <a href="/#about">About</a>
        <a href="/#contact">Contact</a>
        <a href="/#projects">Projects</a>
        <a href="/#work">Work</a>
        <a href="/#blog">Blog</a>
      </nav>
    </header>

    <main>
      <!--CONTENT-->
    </main>

    <footer>
      <em>inspired by <a href="https://www.piapark.me/">piapark.me</a></em>
      <time datetime="<!--LAST_UPDATED-->">last updated <!--LAST_UPDATED--></time>
    </footer>
  </body>
</html>
