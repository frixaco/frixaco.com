<!doctype html>
<html lang="en" data-route="<!--PAGE_ROUTE-->">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="<!--META_DESCRIPTION-->" />
    <meta name="color-scheme" content="light" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='14' y='14' width='36' height='36' rx='2' fill='%233273dc'/%3E%3C/svg%3E"
    />
    <title><!--PAGE_TITLE--></title>
    <style>
      * {
        box-sizing: border-box;
      }

      :where(body, h1, h2, h3, h4, h5, h6, p, ul, ol, blockquote, pre, hr) {
        margin: 0;
      }

      html {
        scroll-padding-top: 2rem;
      }

      body {
        background: whitesmoke;
        color: #000;
        display: flex;
        flex-direction: column;
        font-family: "JetBrains Mono";
        font-size: 95%;
        line-height: 1.5;
        min-height: 100vh;
        overflow-wrap: break-word;
        padding: 20px max(20px, calc((100% - 720px) / 2));
        text-align: left;
        text-transform: lowercase;
      }

      a {
        color: #3273dc;
      }

      :focus-visible {
        outline: 2px solid #3273dc;
        outline-offset: 3px;
      }

      header h2 {
        padding: 0.83em 0;
      }

      header > a {
        color: #000;
        text-decoration: none;
      }

      nav {
        column-gap: 10px;
        display: flex;
        flex-wrap: wrap;
        padding-bottom: 25px;
      }

      nav a {
        color: #444;
      }

      nav a:hover,
      nav a:focus-visible,
      nav a:active {
        background: #444;
        color: #fff;
      }

      main img {
        max-width: 100%;
      }

      main {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 1rem;
      }

      html[data-route="home"] main {
        gap: 2.5rem;
      }

      main section {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      #about img {
        height: 150px;
        object-fit: cover;
        object-position: center;
        width: 150px;
      }

      :is(html[data-route="blog"] main, #blog) > ul {
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
        list-style-type: none;
        padding: 0;
      }

      :is(html[data-route="blog"] main, #blog) > ul > li {
        display: grid;
        grid-template-columns: 130px minmax(0, 1fr);
        row-gap: 0.5rem;
      }

      :is(html[data-route="blog"] main, #blog) > ul > li > p:first-child {
        display: contents;
      }

      :is(html[data-route="blog"] main, #blog) > ul > li > p:first-child em {
        grid-column: 1;
      }

      :is(html[data-route="blog"] main, #blog) > ul > li > p:first-child a {
        grid-column: 2;
        text-wrap: balance;
      }

      :is(html[data-route="blog"] main, #blog) > ul > li > p:not(:first-child) {
        grid-column: 2;
      }

      :is(html[data-route="blog"] main, #blog) > ul > li > p:nth-child(2) {
        color: #444;
        font-size: 0.9em;
      }

      :is(html[data-route="blog"] main, #blog) > ul > li > p:nth-child(2) strong {
        font-weight: 400;
      }

      :is(#projects, #work) > ul > li {
        padding-bottom: 1.5rem;
      }

      :is(#projects, #work) > ul > li:last-child {
        padding-bottom: 0;
      }

      :is(#projects, #work) > ul > li > p {
        padding: 0.125rem 0;
      }

      main code {
        background: #565656;
        color: #fff;
        font-family: inherit;
        font-size: 98%;
        padding: 2px 5px;
        text-transform: none;
      }

      main pre code {
        display: block;
        line-height: 1.55;
        overflow-wrap: anywhere;
        padding: 20px;
        white-space: pre-wrap;
      }

      main blockquote {
        border-left: 1px solid #999;
        color: #444;
        font-size: 98%;
        font-style: italic;
        padding-left: 20px;
      }

      main hr {
        background: linear-gradient(#999, #999) center / 100% 1px no-repeat;
        border: 0;
        height: 3rem;
      }

      footer {
        display: flex;
        font-size: 0.85em;
        justify-content: space-between;
        padding-top: 3rem;
      }

      @media (max-width: 768px) {
        html {
          scroll-padding-top: 3rem;
        }

        body {
          font-size: 18px;
        }

        nav {
          background: whitesmoke;
          padding: 0.5rem 0;
          position: sticky;
          top: 0;
          z-index: 1;
        }

        pre {
          font-size: 0.8em;
        }

        h1,
        h2,
        h3,
        h4 {
          font-size: 1.5em;
        }

        code {
          font-size: 90%;
        }

        nav a {
          font-size: 0.9em;
        }

        :is(
          body:has(#about:target) nav a[href="/#about"],
          body:has(#contact:target) nav a[href="/#contact"],
          body:has(#projects:target) nav a[href="/#projects"],
          body:has(#work:target) nav a[href="/#work"],
          body:has(#more:target) nav a[href="/#more"],
          body:has(#blog:target) nav a[href="/#blog"]
        ) {
          background: #444;
          color: #fff;
        }

        :is(html[data-route="blog"] main, #blog) > ul > li {
          display: flex;
          flex-direction: column;
          gap: 0.5rem;
        }

        :is(html[data-route="blog"] main, #blog) > ul > li > p:first-child {
          display: flex;
          flex-direction: column;
          gap: 0.25rem;
        }

        blockquote {
          font-size: 90%;
        }
      }

      @media (max-width: 380px) {
        html {
          scroll-padding-top: 4.5rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/" aria-label="Rustam Ashurmatov, home">
        <h2>welcome to my corner of the internet</h2>
      </a>
    </header>

    <nav aria-label="Primary">
      <a href="/#about">about</a>
      <a href="/#contact">contact</a>
      <a href="/#projects">projects</a>
      <a href="/#work">work</a>
      <a href="/#more">more</a>
      <a href="/#blog">blog</a>
    </nav>

    <main>
      <!--CONTENT-->
    </main>

    <footer>
      <em></em>
      <time datetime="<!--LAST_UPDATED-->">last updated <!--LAST_UPDATED--></time>
    </footer>
  </body>
</html>
