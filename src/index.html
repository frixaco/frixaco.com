<!doctype html>
<html lang="en" data-route="<!--PAGE_ROUTE-->">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="<!--META_DESCRIPTION-->" />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='14' y='14' width='36' height='36' rx='2' fill='%23e55735'/%3E%3C/svg%3E"
    />
    <title><!--PAGE_TITLE--></title>
    <script>
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.classList.add(theme);
        }
      } catch {}
    </script>
    <style>
      :where(body, h1, h2, h3, h4, h5, h6, p, ul, ol, blockquote, pre, hr) {
        all: unset;
        display: block;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      :root {
        color-scheme: light dark;
        --section-space: 2rem;
        --bg: light-dark(oklch(96.5% 0.008 75), oklch(16% 0.012 55));
        --fg: light-dark(oklch(19% 0.012 55), oklch(91% 0.009 75));
        --muted: light-dark(oklch(46% 0.012 55), oklch(67% 0.012 65));
        --line: light-dark(oklch(79% 0.012 65), oklch(32% 0.014 55));
        --accent: light-dark(oklch(54% 0.205 32), oklch(70% 0.17 38));
        --accent-hover: light-dark(oklch(48% 0.18 32), oklch(80% 0.12 45));
        --code-bg: light-dark(oklch(22% 0.014 55), oklch(11% 0.01 55));
        --code-fg: light-dark(oklch(92% 0.01 75), oklch(90% 0.01 75));
        --selection-bg: light-dark(oklch(80% 0.11 65), oklch(42% 0.1 38));
        --selection-fg: light-dark(oklch(18% 0.02 45), oklch(94% 0.01 75));
      }

      :root.light {
        color-scheme: light;
      }

      :root.dark {
        color-scheme: dark;
      }

      ::selection {
        background: var(--selection-bg);
        color: var(--selection-fg);
      }

      html {
        background: var(--bg);
        overscroll-behavior: none;
        overflow-y: scroll;
      }

      body {
        -webkit-font-smoothing: antialiased;
        align-items: center;
        background: var(--bg);
        color: var(--fg);
        display: flex;
        flex-direction: column;
        font-family: "Avenir Next", Avenir, "Segoe UI Variable", "Segoe UI", sans-serif;
        font-size: 1rem;
        line-height: 1.5;
        min-height: 100vh;
        padding-top: env(safe-area-inset-top);
        padding-inline:
          max(1rem, env(safe-area-inset-left))
          max(1rem, env(safe-area-inset-right));
      }

      a {
        color: inherit;
      }

      button {
        font: inherit;
      }

      img {
        display: block;
        max-width: 100%;
      }

      header {
        align-items: stretch;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
        display: flex;
        flex-wrap: wrap;
        justify-content: end;
        max-width: 48rem;
        min-height: 3.5rem;
        position: sticky;
        top: env(safe-area-inset-top);
        width: 100%;
        z-index: 1;
      }

      header > a,
      header nav a,
      #theme-toggle {
        align-items: center;
        display: inline-flex;
        font-size: 0.75rem;
        font-weight: 650;
        letter-spacing: 0.06em;
        min-height: 2.75rem;
        text-decoration: none;
        text-transform: uppercase;
      }

      header > a {
        flex-basis: 100%;
      }

      header nav {
        align-items: stretch;
        border-top: 1px solid var(--line);
        display: flex;
        width: 100%;
      }

      header nav a,
      #theme-toggle {
        border: 0;
        border-left: 1px solid var(--line);
        flex: 1;
        justify-content: center;
        padding-inline: 0.75rem;
      }

      header nav a:first-child {
        border-left: 0;
      }

      #theme-toggle {
        background: none;
        color: var(--accent);
        cursor: pointer;
        inline-size: 2.75rem;
      }

      #theme-toggle::before {
        content: "\263D\FE0E";
        font-size: 1.125rem;
        font-weight: 400;
        letter-spacing: 0;
        line-height: 1;
      }

      :root.dark #theme-toggle::before {
        content: "\263C\FE0E";
      }

      :is(
          html[data-route="home"] nav a[href="/"],
          html[data-route="blog"] nav a[href="/blog"],
          html[data-route="post"] nav a[href="/blog"],
          html[data-route="more"] nav a[href="/more"]
        ) {
        box-shadow: inset 0 -2px var(--accent);
        color: var(--accent);
      }

      header > a:hover,
      header nav a:hover,
      #theme-toggle:hover {
        color: var(--accent);
      }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      main {
        display: flex;
        flex: 1;
        flex-direction: column;
        max-width: 48rem;
        min-width: 0;
        padding-block: var(--section-space) 4rem;
        row-gap: 0.25rem;
        width: 100%;
      }

      main :is(h1, h2, h3, h4, h5, h6) {
        overflow-wrap: break-word;
        text-wrap: balance;
      }

      main h2 {
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.025em;
        line-height: 1.15;
        padding-block: 2.25rem 0.75rem;
      }

      main h3 {
        font-size: 1rem;
        font-weight: 650;
        line-height: 1.35;
        padding-top: 1rem;
      }

      main :is(h4, h5, h6) {
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        padding-block: 1.75rem 0.25rem;
        text-transform: uppercase;
      }

      main p {
        max-width: 68ch;
        text-wrap: pretty;
      }

      main > p + p {
        padding-top: 0.5rem;
      }

      main strong {
        font-weight: 650;
      }

      main a {
        text-decoration-color: var(--line);
        text-decoration-thickness: 1px;
        text-underline-offset: 0.16em;
      }

      main a:hover {
        color: var(--accent-hover);
        text-decoration-color: currentColor;
      }

      main h3 a {
        text-decoration: none;
      }

      main h3 a[href^="http"]::after {
        color: var(--accent);
        content: "\2197";
        font-size: 0.75em;
        padding-left: 0.35em;
        vertical-align: 0.12em;
      }

      main h3 + p + p:has(> strong) {
        color: var(--muted);
        font-size: 0.75rem;
        letter-spacing: 0.02em;
        padding-top: 0.1rem;
      }

      main hr {
        background: linear-gradient(var(--line), var(--line)) center / 100% 1px no-repeat;
        padding-block: 1.25rem;
      }

      main :is(ul, ol) {
        padding: 0.5rem 0 0.75rem 1.25rem;
      }

      main ul {
        list-style-type: disc;
      }

      main ol {
        list-style-type: decimal;
      }

      main li {
        padding-left: 0.15rem;
      }

      main li:not(:last-child) {
        padding-bottom: 0.3rem;
      }

      main li::marker {
        color: var(--accent);
      }

      main blockquote {
        background: linear-gradient(var(--accent), var(--accent)) left center / 2px
          calc(100% - 2.5rem) no-repeat;
        color: var(--muted);
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        padding: 1.25rem 0 1.25rem 1rem;
      }

      main :is(code, pre) {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-variant-ligatures: none;
      }

      main code {
        background: var(--code-bg);
        color: var(--code-fg);
        font-size: 0.86em;
        padding: 0.12em 0.35em;
      }

      main pre {
        background: linear-gradient(var(--code-bg), var(--code-bg)) center / 100%
          calc(100% - 2.5rem) no-repeat;
        color: var(--code-fg);
        font-size: 0.8125rem;
        line-height: 1.55;
        max-width: 100%;
        overflow-x: auto;
        padding: 2.25rem 1rem;
        tab-size: 2;
        white-space: pre;
      }

      main pre code {
        background: none;
        color: inherit;
        font-size: inherit;
        padding: 0;
      }

      main img {
        height: auto;
        padding-block: 1.25rem;
      }

      html[data-route="home"] main > p:first-child {
        font-size: 1.25rem;
        font-weight: 500;
        letter-spacing: -0.02em;
        line-height: 1.35;
        max-width: 48ch;
      }

      html[data-route="home"] main > p:nth-child(2) {
        color: var(--muted);
        font-size: 0.8125rem;
        padding-top: 1rem;
      }

      html[data-route="home"] main > hr {
        display: none;
      }

      html[data-route="home"] main h2 {
        display: flex;
        flex-direction: column;
        font-size: 0.75rem;
        font-weight: 700;
        gap: var(--section-space);
        letter-spacing: 0.1em;
        padding-block: calc(var(--section-space) - 0.25rem) 0.5rem;
        text-transform: uppercase;
      }

      html[data-route="home"] main h2::before {
        background: var(--fg);
        content: "";
        height: 1px;
      }

      html[data-route="home"] main h3 + p {
        line-height: 1.45;
      }

      html[data-route="blog"] main h3,
      html[data-route="more"] main h3:first-child {
        padding-top: 0;
      }

      html[data-route="blog"] main h3 + p {
        color: var(--muted);
        font-size: 0.75rem;
        font-variant-numeric: tabular-nums;
        padding-block: 0.05rem;
      }

      html[data-route="blog"] main h3 + p code {
        background: none;
        color: inherit;
        font-family: inherit;
        font-size: inherit;
        padding: 0;
      }

      html[data-route="blog"] main h3 + p + p {
        padding-top: 0;
      }

      html[data-route="blog"] main hr {
        padding-block: 1rem;
      }

      html[data-route="post"] main {
        padding-top: 3rem;
      }

      html[data-route="post"] main > :is(h1, h2):first-child {
        font-size: clamp(2rem, 6vw, 3.25rem);
        font-weight: 600;
        letter-spacing: -0.045em;
        line-height: 1;
        max-width: 18ch;
        padding: 0 0 2.25rem;
      }

      html[data-route="post"] main :is(p, li) {
        line-height: 1.65;
      }

      @media (prefers-color-scheme: dark) {
        :root:not(.light) #theme-toggle::before {
          content: "\263C\FE0E";
        }
      }

      footer {
        color: var(--muted);
        font-size: 0.75rem;
        font-variant-numeric: tabular-nums;
        max-width: 48rem;
        padding-bottom: 2rem;
        text-align: right;
        width: 100%;
      }

      @media (min-width: 20rem) {
        header {
          flex-wrap: nowrap;
        }

        header > a {
          flex-basis: auto;
        }

        header nav {
          border-top: 0;
          width: auto;
        }

        header nav a,
        #theme-toggle {
          flex: none;
        }

        header nav a:first-child {
          border-left: 1px solid var(--line);
        }
      }

      @media (min-width: 40rem) {
        :root {
          --section-space: 3rem;
        }

        body {
          padding-inline:
            max(1.5rem, env(safe-area-inset-left))
            max(1.5rem, env(safe-area-inset-right));
        }

        header nav a,
        #theme-toggle {
          padding-inline: 1rem;
        }

        main {
          padding-block: var(--section-space) 6rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="/">Home</a>
        <a href="/blog">Blog</a>
        <a href="/more">More</a>
        <button id="theme-toggle" type="button" aria-label="Toggle color theme"></button>
      </nav>
    </header>

    <main>
      <!--CONTENT-->
    </main>

    <footer>
      <time datetime="<!--LAST_UPDATED-->">updated <!--LAST_UPDATED--></time>
    </footer>

    <script type="module">
      const root = document.documentElement;
      const toggle = document.getElementById("theme-toggle");

      for (const link of document.querySelectorAll(
        'html[data-route="home"] main :is(h3 > a[href^="http"], a[href="/pdf"])',
      )) {
        link.setAttribute("target", "_blank");
        link.setAttribute("rel", "noopener");
      }

      const isDark = () =>
        root.classList.contains("dark") ||
        (!root.classList.contains("light") &&
          matchMedia("(prefers-color-scheme: dark)").matches);

      function syncToggle() {
        const next = isDark() ? "light" : "dark";
        toggle.setAttribute("aria-label", `Use ${next} theme`);
      }

      syncToggle();

      toggle.addEventListener("click", () => {
        const next = isDark() ? "light" : "dark";
        root.classList.remove("light", "dark");
        root.classList.add(next);
        try {
          localStorage.setItem("theme", next);
        } catch {}
        syncToggle();
      });
    </script>
  </body>
</html>
